      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],

            amber: {
              50: '#fffbeb',

              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',

              950: '#451a03',
            }

          animation: {
            fadeIn: 'fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            fadeIn: {

    svg {

      vertical-align: middle;

      max-height: 24px;

</head>

                  e('span', { className: 'text-xs text-slate-500' }, p.category)
                ))
              )
            )
          ),

          // We CARE Values
          e('section', { className: 'py-20 bg-slate-900 text-white' },
            e('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center' },
              e('span', { className: 'text-amber-400 font-bold text-xs tracking-widest uppercase' }, 'CORPORATE CULTURE'),
              e('h2', { className: 'text-3xl font-extrabold mt-1 mb-12' }, 'We CARE Values'),
              e('div', { className: 'grid grid-cols-2 md:grid-cols-4 gap-6' },
                companyValues.map((v) => e('div', { key: v.key, className: 'p-6 bg-slate-800 rounded-2xl border border-slate-700 text-left' },
                  e('span', { className: 'text-4xl font-black text-amber-400 block mb-2' }, v.key),
                  e('h3', { className: 'font-bold text-lg text-white' }, v.title),
                  e('p', { className: 'text-xs text-slate-400 mt-1' }, v.tagline)
                ))
              )
            )
          ),

          // Persistent Footer
          e('footer', { className: 'bg-slate-950 text-slate-300 border-t border-slate-800 mt-auto' },
            e('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16' },
              e('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-12 text-xs' },
                e('div', null,
                  e('h3', { className: 'font-bold text-amber-400 uppercase tracking-widest mb-4' }, 'Sitemap & Navigation'),
                  e('div', { className: 'grid grid-cols-1 gap-2 text-slate-400' },
                    ['Home', 'About', 'Product & Service', 'Information'].map((m) =>
                      e('button', { key: m, onClick: () => openModal(m), className: 'text-left hover:text-amber-400 py-0.5' }, `› ${m}`)
                    )
                  )
                ),
                e('div', null,
                  e('h3', { className: 'font-bold text-amber-400 uppercase tracking-widest mb-4' }, 'Head Office Contact'),
                  e('p', { className: 'leading-relaxed text-slate-400' }, 'Gedung Dummy Cyber Park, Jl. Jendral Sudirman No. 88, Jakarta Selatan 12190 - Indonesia'),
                  e('p', { className: 'mt-2 text-slate-400' }, 'Tel: +62 21 500 0000 | Fax: +62 21 500 0001'),
                  e('p', { className: 'text-amber-400 mt-1' }, 'corporate.secretary@dummytech.com')
                ),
                e('div', null,
                  e('h3', { className: 'font-bold text-amber-400 uppercase tracking-widest mb-4' }, 'Corporate Identity'),
                  e('span', { className: 'font-extrabold text-xl text-white block' }, 'DUMMY'),
                  e('span', { className: 'text-[10px] font-bold text-amber-400 tracking-widest block uppercase' }, 'TECHNOLOGY GROUP'),
                  e('p', { className: 'mt-2 text-slate-400' }, 'Leading System Integrator in Indonesia delivering Cloud, Security Platforms, and Managed Services.'),
                  e('span', { className: 'inline-block mt-3 bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded font-mono font-bold' }, 'IDX: DUMM')
                )
              )
            ),
            e('div', { className: 'bg-slate-950 py-6 border-t border-slate-900 text-center text-xs text-slate-500' },
              '© 2026 PT Dummy Technology Tbk. All Rights Reserved.'
            )
          ),

          // Search Modal
          isSearchOpen ? e('div', { className: 'fixed inset-0 z-50 flex items-start justify-center pt-20 bg-slate-950/70 backdrop-blur-md' },
            e('div', { className: 'bg-white rounded-xl p-6 w-full max-w-xl shadow-2xl' },
              e('div', { className: 'flex justify-between items-center mb-4' },
                e('h3', { className: 'font-bold text-slate-900' }, 'Search Dummy Technology'),
                e('button', { onClick: () => setIsSearchOpen(false) }, e(CloseIcon, { className: 'w-5 h-5 text-gray-500' }))
              ),
              e('input', {
                type: 'text',
                placeholder: 'Type to search services, IT support, news...',
                value: searchQuery,
                onChange: (ev) => setSearchQuery(ev.target.value),
                className: 'w-full border border-gray-300 p-3 rounded-lg text-sm focus:outline-none focus:border-amber-500'
              })
            )
          ) : null,

          // Detail Modal
          modalData.isOpen ? e('div', { className: 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md' },
            e('div', { className: 'bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4' },
              e('div', { className: 'flex justify-between items-start border-b pb-3' },
                e('h3', { className: 'font-bold text-slate-900 text-lg' }, modalData.title),
                e('button', { onClick: () => setModalData({ isOpen: false, title: '', content: '' }) }, e(CloseIcon, { className: 'w-5 h-5 text-gray-500' }))
              ),
              e('p', { className: 'text-sm text-slate-700 leading-relaxed whitespace-pre-line' }, modalData.content),
              e('div', { className: 'pt-2 text-right' },
                e('button', {
                  onClick: () => setModalData({ isOpen: false, title: '', content: '' }),
                  className: 'bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-lg'
                }, 'Close')
              )
            )
          ) : null

        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    }
  </script>
